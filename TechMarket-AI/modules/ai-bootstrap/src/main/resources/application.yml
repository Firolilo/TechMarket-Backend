spring:
  application:
    name: ai-service

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5434}/${DB_NAME:postgres}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      pool-name: ai-service-hikari
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALID_TIMEOUT_MS:3000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      initialization-fail-timeout: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  ai:
    # Default LLM provider: Google Gemini (free tier) via its OpenAI-compatible
    # endpoint, so the Spring AI OpenAI client is reused. Requires GEMINI_API_KEY.
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
          temperature: 0.2
      embedding:
        # Gemini's OpenAI-compatible embeddings, used by the marketplace semantic index.
        embeddings-path: /embeddings
        options:
          model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    model:
      chat: openai
      # "openai" = Gemini via the OpenAI-compatible endpoint above. The `test` profile overrides
      # this back to `none` so the offline suite keeps using the zero-vector stub embedding.
      embedding: openai
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    vectorstore:
      pgvector:
        initialize-schema: ${PGVECTOR_INIT_SCHEMA:true}
        index-type: ${PGVECTOR_INDEX_TYPE:HNSW}
        distance-type: ${PGVECTOR_DISTANCE:COSINE_DISTANCE}

server:
  port: ${AI_SERVICE_PORT:8091}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

security:
  jwt:
    enabled: ${JWT_ENABLED:false}

logging:
  level:
    root: INFO
    com.techmarket: INFO
  file:
    name: ${LOG_FILE:${user.dir}/.runtime/logs/ai-service.log}
