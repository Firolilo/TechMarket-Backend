# Docker profile for the AI service. LLM + embeddings = Gemini (inherited from application.yml;
# requires GEMINI_API_KEY). The marketplace semantic index uses REAL pgvector, co-located in the
# TechMarket-IA Postgres (which must run the pgvector extension: the pgvector/pgvector image).
server:
  port: ${AI_SERVICE_PORT:8091}

spring:
  datasource:
    # pgvector index lives in the IA Postgres (data locality). Override via AI_DB_* if needed.
    url: ${AI_DB_URL:jdbc:postgresql://ia-postgres:5432/TECHMARKET_ia}
    username: ${AI_DB_USER:postgres}
    password: ${AI_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  autoconfigure:
    exclude:
      # Audio speech off; DataSource + PgVector are now ENABLED for real semantic search.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
  # LLM + embeddings provider (Gemini) inherited from application.yml; requires GEMINI_API_KEY.

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
