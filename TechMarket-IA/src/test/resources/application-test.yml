spring:
  datasource:
    url: jdbc:h2:mem:TECHMARKETia_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-shared-iam-secret-value-32-bytes-minimum
    issuer: TECHMARKET-ia
    trusted-issuers: iam-service,TECHMARKET-ia
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
