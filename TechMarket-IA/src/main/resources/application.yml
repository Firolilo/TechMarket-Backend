spring:
  application:
    name: TECHMARKET-ia
  profiles:
    default: dev

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:TechMarket2024SecretKeyForJWTMustBe256BitsMinimumLength!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
